<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · pwgen</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <script type="module" src="/static/js/login.js"></script>
</head>
<body class="page page--login">

  <main class="login">

    <div class="login-brand">
      <span class="brand-mark">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3"/><path d="m16 7 3 3"/><path d="m18 5 2 2"/></svg>
      </span>
      <span class="brand-name">pwgen</span>
    </div>

    <p class="host-pill">
      <span class="status-dot" data-state="unknown" aria-hidden="true"></span>
      <span id="nas-host">your NAS</span>
    </p>

    <section class="card login-card" aria-labelledby="login-title">
      <div class="card-head">
        <h1 id="login-title" class="card-title">Sign in</h1>
        <p class="card-lede">Use your NAS account, the same one you use for SSH.</p>
      </div>

      <div id="login-error" class="alert alert--error" role="alert" hidden>
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
        <span class="alert-text"></span>
      </div>

      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input class="input mono" id="username" name="username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="input mono" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--block" id="login-button" type="submit">Sign in</button>
      </form>
    </section>

    <ul class="trust-notes">
      <li class="trust-note">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3z"/></svg>
        <span>Passwords are encrypted to your age key before they’re stored. This server can’t read them.</span>
      </li>
      <li class="trust-note">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4"/><path d="M12 11 6.5 17.5"/><path d="m12 11 5.5 6.5"/></svg>
        <span>Only reachable over your tailnet, with HTTPS from Tailscale.</span>
      </li>
    </ul>

  </main>

</body>
</html>
